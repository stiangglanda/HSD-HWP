/* Reset, AXF laden, Startregister setzen.
 * SRAM-Remap erfolgt in ram_system_init() vor __main.
 * Utilities / Update Target before Debugging bleibt AUS.
 */
FUNC void SetupSRAM(void) {
    SP = _RDWORD(0x20000000);
    PC = _RDWORD(0x20000004);
    XPSR = 0x01000000;
}

/* Vollständiger System-/Hardware-Reset mit Halt muss erfolgreich sein. */
RESET
LOAD %L INCREMENTAL
SetupSRAM();
